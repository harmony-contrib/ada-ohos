name: Build test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test on ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust environment
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: 'aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos,x86_64-unknown-linux-ohos'
      
      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v0.1
        id: setup-ohos
        with:
          version: '5.0.0'

      - name: Setup Zig for OpenHarmony
        uses: openharmony-rs/setup-zig-ohos@v0.1
        id: setup-zig
        with:
          version: '0.16.0-dev.312+164c598cd'

      - name: Build
        run: |
          cargo install cargo-zigbuild
          cargo isstall ohrs
          ohrs build --release --zigbuild